# PIPELINE DEFINITION
# Name: pipeline-bos-pcdf
# Description: Exemplo didatico: extract -> clean, 2 componentes KFP (Aula 06, projeto-guia PCDF).
# Inputs:
#    quantidade: int [Default: 5.0]
# Outputs:
#    Output: str
components:
  comp-extrair-relatos:
    executorLabel: exec-extrair-relatos
    inputDefinitions:
      parameters:
        quantidade:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-limpar-relatos:
    executorLabel: exec-limpar-relatos
    inputDefinitions:
      parameters:
        relatos_json:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-extrair-relatos:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - extrair_relatos
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extrair_relatos(quantidade: int) -> str:\n    \"\"\"Componente\
          \ 1 -- gera um mini-dataset ficticio de relatos (E de\n    ETL) e devolve\
          \ como uma string JSON -- a \"saida tipada\" que o\n    proximo componente\
          \ vai receber como entrada.\"\"\"\n    import pandas as pd\n\n    dados\
          \ = [\n        {\"id\": i, \"texto_relato\": f\"  RELATO {i}  \"}\n    \
          \    for i in range(1, quantidade + 1)\n    ]\n    df = pd.DataFrame(dados)\n\
          \    return df.to_json()\n\n"
        image: python:3.11
    exec-limpar-relatos:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - limpar_relatos
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef limpar_relatos(relatos_json: str) -> str:\n    \"\"\"Componente\
          \ 2 -- recebe a saida do componente 1 como entrada\n    tipada (mesma ideia\
          \ do XCom no Airflow, mas aqui e uma conexao\n    explicita entre componentes,\
          \ definida no pipeline abaixo).\"\"\"\n    import io\n    import pandas\
          \ as pd\n\n    df = pd.read_json(io.StringIO(relatos_json))\n    df[\"texto_relato\"\
          ] = df[\"texto_relato\"].str.lower().str.strip()\n    print(df.head().to_string())\n\
          \    return df.to_json()\n\n"
        image: python:3.11
pipelineInfo:
  description: 'Exemplo didatico: extract -> clean, 2 componentes KFP (Aula 06, projeto-guia
    PCDF).'
  name: pipeline-bos-pcdf
root:
  dag:
    outputs:
      parameters:
        Output:
          valueFromParameter:
            outputParameterKey: Output
            producerSubtask: limpar-relatos
    tasks:
      extrair-relatos:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-extrair-relatos
        inputs:
          parameters:
            quantidade:
              componentInputParameter: quantidade
        taskInfo:
          name: extrair-relatos
      limpar-relatos:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-limpar-relatos
        dependentTasks:
        - extrair-relatos
        inputs:
          parameters:
            relatos_json:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: extrair-relatos
        taskInfo:
          name: limpar-relatos
  inputDefinitions:
    parameters:
      quantidade:
        defaultValue: 5.0
        isOptional: true
        parameterType: NUMBER_INTEGER
  outputDefinitions:
    parameters:
      Output:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
